# SynfoTalent edge, HTTP only.
#
# This listener is for a private network or a load balancer that terminates TLS
# in front of Nginx. Do not expose port 8080 on the public internet without TLS.
# To terminate TLS in this container, replace this file with
# deploy/nginx/tls.conf.example and mount fullchain.pem plus privkey.pem.
#
# The image runs as a non-root user, so the listen port is 8080.
# /media/ is never served. Resume bytes go through the API download view
# (local disk) or a short-lived object-storage URL after that view authorizes them.
# Static files come from the backend collectstatic volume. The SPA is the image's
# built frontend.

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /media/ {
        return 404;
    }

    location /static/ {
        root /var/www;
        access_log off;
        expires 7d;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
