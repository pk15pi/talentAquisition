# Local development. The API process is runserver (command web-dev).
# Production is docker-compose.prod.yml and does not use this file.
# Redis is published without a password for a laptop broker. Do not publish it that way on a shared host.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synfotalent}
      POSTGRES_USER: ${POSTGRES_USER:-synfotalent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synfotalent_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synfotalent} -d ${POSTGRES_DB:-synfotalent}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  backend:
    build: ./backend
    entrypoint: ["sh", "/app/docker-entrypoint.sh"]
    command: ["web-dev"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  worker:
    build: ./backend
    entrypoint: ["sh", "/app/docker-entrypoint.sh"]
    command: ["worker"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_started
  beat:
    build: ./backend
    entrypoint: ["sh", "/app/docker-entrypoint.sh"]
    command: ["beat"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
  media_data:
